      postgres:
        condition: service_healthy
      registry-service:
        condition: service_healthy
      axon-server:
        condition: service_healthy
    networks:
      - microservices-network
    restart: always

  # Insurance Service
  insurance-service:
    build:
      context: ./service
      dockerfile: insurance-service/Dockerfile
    container_name: insurance-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/insurance-service
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://registry-service:8761/eureka/
      - AXON_AXONSERVER_SERVERS=axon-server:8124
    depends_on:
      postgres:
        condition: service_healthy
      registry-service:
        condition: service_healthy
      axon-server:
        condition: service_healthy
    networks:
      - microservices-network
    restart: always

  # Clinical Service
  clinical-service:
    build:
      context: ./service
      dockerfile: clinical-service/Dockerfile
    container_name: clinical-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/clinical-service
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
