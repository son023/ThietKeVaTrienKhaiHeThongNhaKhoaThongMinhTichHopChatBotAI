services:
  neo4j:
    image: neo4j:5.23.0
    container_name: chatbot-neo4j
    restart: always
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_dbms_default__database: neo4j
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "-d", "system", "SHOW DATABASES"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: chatbot-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: dental_chatbot
    volumes:
      - mongodb-data:/data/db
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Chatbot Service
  chatbot-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-service
    restart: always
    depends_on:
      neo4j:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "9992:9992"
    environment:
      # Database Config - Force set cho Docker
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: dental_chatbot
      
      # AI & Model Config
      GEMINI_API_KEY: AIzaSyDqiKnFznvgMHbIcB7v9K6ttDZAqzwBry4
      INTENT_MODEL_PATH: app/models/intent_model
      NER_MODEL_PATH: app/models/ner_model_final/checkpoint-1545
      
      # System Config
      USE_GPU: "false"
      
      # Knowledge Base Config
      KB_DATA_FILE: kb_v4_final_train.json
    volumes:
      - ./app/models:/app/app/models:ro
    networks:
      - chatbot-network
    command: >
      sh -c "
        echo 'Waiting for Neo4j to be ready...' &&
        sleep 10 &&
        echo 'Loading knowledge base into Neo4j...' &&
        python build_knowledge_base.py &&
        echo 'Starting chatbot service...' &&
        python -m app.main
      "

networks:
  chatbot-network:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  mongodb-data:
