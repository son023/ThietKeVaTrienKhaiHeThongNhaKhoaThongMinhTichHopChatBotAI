spring.application.name=labtest-service
server.port=8088
axon.axonserver.servers=${AXON_AXONSERVER_SERVERS:localhost:8124}

eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/labtest-service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}


spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false



springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/api-docs

feign.user-service.url=${FEIGN_USER_SERVICE_URL:http://localhost:8085/user-service/users}
feign.doctor-service.url=${FEIGN_DOCTOR_SERVICE_URL:http://localhost:8090/doctor-service/doctors}
feign.patient-service.url=${FEIGN_PATIENT_SERVICE_URL:http://localhost:8089/patient-service/patients}
feign.appointment-service.url=${FEIGN_APPOINTMENT_SERVICE_URL:http://localhost:8082/appointment-service/appointments}
feign.invoice-service.url=${FEIGN_INVOICE_SERVICE_URL:http://localhost:8084/invoice-service/invoices}



spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000