import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
    id "com.google.protobuf" version "0.9.4"
}

group = 'com.main_project'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.0")
}


dependencies {
    // 1. Spring Web (Để chạy API Controller)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 2. Temporal SDK (Giống project mẫu)
    implementation 'io.temporal:temporal-sdk:1.22.2'

    // 3. Eureka Client (Thư viện bạn bị thiếu/lỗi)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // 4. gRPC Client (Để gọi các service khác)
    implementation 'net.devh:grpc-spring-boot-starter:2.15.0.RELEASE' // (Lưu ý: net.devh V3+ cho Spring Boot 3)

    // 5. gRPC Dependencies (Protobuf & Stub)
    implementation 'io.grpc:grpc-protobuf:1.58.0'
    implementation 'io.grpc:grpc-stub:1.58.0'

    // 6. Sửa lỗi Java 9+ cho gRPC/javax (Giống file pom.xml)
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // 7. Swagger (SPRINGDOC) (Giống file pom.xml)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // 8. Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 9. Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

// Cấu hình cho plugin protobuf
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.64.0"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
